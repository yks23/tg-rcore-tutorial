# 默认编译目标：RISC-V 64 位裸机平台
# 使 cargo build 自动进行交叉编译，无需每次指定 --target
[build]
target = "riscv64gc-unknown-none-elf"

# QEMU 运行器（实验 9/10：核数由环境变量 RCORE_SMP 控制，默认 8）
# 单核对照：RCORE_SMP=1 cargo run --release
# 请在各章目录下执行 cargo run，以便 ../scripts 路径正确。
[target.riscv64gc-unknown-none-elf]
runner = [
    "bash",
    "../scripts/qemu-virt-kernel.sh",
]
